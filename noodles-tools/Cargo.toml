[package]
name = "noodles-tools"
version = "0.1.0"
license.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A samtools-compatible command-line toolkit built on noodles"
publish = false

[[bin]]
name = "ntools"
path = "src/main.rs"

[features]
default = ["libdeflate"]
libdeflate = ["noodles-bgzf/libdeflate", "noodles-cram/libdeflate"]

[dependencies]
anyhow = "1.0.86"
bstr.workspace = true
clap = { version = "4.5.0", features = ["derive"] }
crc32fast = "1.4.0"
crossbeam-channel = "0.5.6"
flate2.workspace = true
indexmap.workspace = true
lexical-core.workspace = true
libc = "0.2.150"
md-5 = "0.11.0"
memchr.workspace = true
noodles-bam = { path = "../noodles-bam" }
noodles-bgzf = { path = "../noodles-bgzf" }
noodles-core = { path = "../noodles-core" }
noodles-cram = { path = "../noodles-cram" }
noodles-csi = { path = "../noodles-csi" }
noodles-fasta = { path = "../noodles-fasta" }
noodles-pileup = { path = "../noodles-pileup" }
noodles-sam = { path = "../noodles-sam" }
noodles-util = { path = "../noodles-util", features = ["alignment"] }
regex = { version = "1.10.0", default-features = false, features = ["std", "perf"] }
tempfile = "3.10.0"

[dev-dependencies]
assert_cmd = "2.0.14"

[lints]
workspace = true
